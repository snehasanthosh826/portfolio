name: Auto-Sync Portfolio Project Manifest

on:
  schedule:
    # Runs automatically at the start of every single hour to fetch ecosystem changes
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allows instant manually triggered syncs from the actions dashboard tab

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    # Grant permissions to write content adjustments back down into your workspace tree
    permissions:
      contents: write

    steps:
    # 1. Pull down website workspace structure
    - name: Checkout portfolio repository
      uses: actions/checkout@v4

    # 2. Launch execution container runtime
    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Mount packages infrastructure
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Generate fresh compiled array map
    - name: Rebuild Projects JSON
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python update_portfolio.py

    # 5. Commit modifications back into main branch if differences exist
    - name: Commit and Push manifest updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        if [ -n "$(git status --porcelain projects.json)" ]; then
          git add projects.json
          git commit -m "chore: auto-sync repository portfolio data [skip ci]"
          git push
        else
          echo "No layout updates or new code pushes detected across profile."
        fi
