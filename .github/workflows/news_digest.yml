name: Automated Morning News Briefing

on:
  schedule:
    # Triggers every single morning at 01:30 UTC (7:00 AM IST)
    - cron: '30 1 * * *'
  workflow_dispatch:
    # Allows manual test execution from your Actions dashboard panel

jobs:
  scrape-and-compile:
    runs-on: ubuntu-latest

    steps:
    - name: Pull down repository code
      uses: actions/checkout@v4

    - name: Initialize Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute News Engine Script
      env:
        SENDER_EMAIL: ${{ secrets._SENDER_EMAIL_ }}
        SENDER_PASSWORD: ${{ secrets._SENDER_PASSWORD_ }}
        RECEIVER_EMAIL: ${{ secrets._RECEIVER_EMAIL_ }}
      run: python news_bot.py
