name: Run Pulse Daily Bot

on:
  schedule:
    # Automatically triggers every day at 06:00 AM UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allows you to trigger the workflow manually with a click on GitHub

jobs:
  run-pulse:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down your repository code onto the runner machine
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. Configure Python environment on the virtual machine
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Install required packages using your requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Run your python bot with securely linked credentials
    - name: Run daily summary script
      env:
        CITY: "Thiruvananthapuram"
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python bot.py

    # 5. Extract and upload the text file before the runner clears out
    - name: Upload summary as artifact
      uses: actions/upload-artifact@v4
      with:
        name: daily-summary-report
        path: daily_summary.txt
