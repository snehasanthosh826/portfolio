name: Run Weather Alert Monitor

on:
  schedule:
    # Triggers every morning at 03:00 UTC (08:30 AM IST)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allows manual test execution via the Actions tab

jobs:
  monitor-weather:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Weather Monitor Script
      env:
        OPENWEATHER_API_KEY: ${{ secrets._OPENWEATHER_API_KEY_ }}
        CITY: "Thiruvananthapuram"
        SENDER_EMAIL: ${{ secrets._SENDER_EMAIL_ }}
        SENDER_PASSWORD: ${{ secrets._SENDER_PASSWORD_ }}
        RECEIVER_EMAIL: ${{ secrets._RECEIVER_EMAIL_ }}
      run: python weather.py
